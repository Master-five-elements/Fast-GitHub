<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub 加速</title>
    <link rel="stylesheet" href="../lib/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="fg-body popup-body">
    <div class="fg-toast-wrap" id="toastWrap"></div>

    <header class="ph">
      <div class="ph-brand">
        <div class="brand-logo">GH</div>
        <div>
          <div class="ph-title">GitHub 加速</div>
          <div class="ph-sub" id="phSub">智能节点 · 自动择优</div>
        </div>
      </div>
      <label class="fg-switch" title="启用 / 停用">
        <input type="checkbox" id="enabled" />
        <span class="fg-switch-track"></span>
      </label>
    </header>

    <section class="p-card" id="nodeCard">
      <div class="p-card-head">
        <span class="p-card-label">当前节点</span>
        <span class="fg-badge fg-badge-accent" id="strategyTag">自动</span>
      </div>
      <div class="p-node" id="nodeValue">—</div>
      <div class="p-metrics">
        <span class="fg-badge" id="nodeLatency">未测速</span>
        <span class="fg-badge" id="nodeSpeed">—</span>
      </div>
      <div class="p-actions">
        <button class="fg-btn fg-btn-sm" id="btnTest">测速</button>
        <button class="fg-btn fg-btn-sm" id="btnNext">换一个</button>
        <button class="fg-btn fg-btn-sm" id="btnSync">同步节点</button>
      </div>
    </section>

    <section class="p-block">
      <div class="p-block-title">当前页面</div>
      <div class="p-url" id="currentUrl">—</div>
      <div class="p-actions p-actions-2">
        <button class="fg-btn fg-btn-sm fg-btn-primary" id="btnProxy">一键代理</button>
        <button class="fg-btn fg-btn-sm" id="btnCopy">复制链接</button>
      </div>
    </section>

    <footer class="pf">
      <span id="syncInfo">最近同步：—</span>
      <button class="fg-btn fg-btn-sm" id="btnOptions">设置</button>
    </footer>

    <script src="../lib/default-nodes.js"></script>
    <script src="../lib/store.js"></script>
    <script src="../lib/net.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
